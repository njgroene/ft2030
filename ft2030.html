<title>French Tech 2030 Breakdown</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen atlas. Zoomable circle map on the left, a reading panel on the right that follows the current layer.
   Palette after the French state design system used on lafrenchtech.gouv.fr: Bleu France, Rouge Marianne, neutral greys. */
:root {
  --bg: #f6f6f6; --surface: #ffffff; --ink: #161616; --ink-2: #3a3a3a; --ink-3: #666666;
  --line: #dddddd; --ring-1: #f4f6fe; --ring-2: #e3e3fd; --ring-stroke: #cacafb;
  --accent: #000091; --on-accent: #f5f5fe; --red: #e1000f;
  --ai: #e1000f; --ai-soft: #ffe9e9; --ai-ink: #ce0500; --halo: #ffffff; --mark: #c7f6fc;
  --c1: #000091; --c2: #00795a; --c3: #6e445a; --c4: #b34000; --c5: #a94645;
  --c6: #716043; --c7: #3558a2; --c8: #666666;
  --none: #cecece; --on-dot: #ffffff;
  --f-display: 'Marianne', 'Public Sans', Arial, sans-serif;
  --f-body: 'Marianne', 'Public Sans', Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', 'Courier New', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161616; --surface: #1e1e1e; --ink: #f6f6f6; --ink-2: #cecece; --ink-3: #929292;
    --line: #353535; --ring-1: #1b1b35; --ring-2: #21213f; --ring-stroke: #3b3b7a;
    --accent: #8585f6; --on-accent: #161616; --red: #f95c5e;
    --ai: #f95c5e; --ai-soft: #3b1213; --ai-ink: #ffbdbd; --halo: #1e1e1e; --mark: #1f4f55;
    --c1: #8585f6; --c2: #3bbf8f; --c3: #c79ab3; --c4: #f2905c; --c5: #e3807e;
    --c6: #c9ad6a; --c7: #7e9ce0; --c8: #a0a0a0;
    --none: #4a4a4a; --on-dot: #161616;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #161616; --surface: #1e1e1e; --ink: #f6f6f6; --ink-2: #cecece; --ink-3: #929292;
    --line: #353535; --ring-1: #1b1b35; --ring-2: #21213f; --ring-stroke: #3b3b7a;
    --accent: #8585f6; --on-accent: #161616; --red: #f95c5e;
    --ai: #f95c5e; --ai-soft: #3b1213; --ai-ink: #ffbdbd; --halo: #1e1e1e; --mark: #1f4f55;
    --c1: #8585f6; --c2: #3bbf8f; --c3: #c79ab3; --c4: #f2905c; --c5: #e3807e;
    --c6: #c9ad6a; --c7: #7e9ce0; --c8: #a0a0a0;
    --none: #4a4a4a; --on-dot: #161616;
    color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;
}
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 28px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand .eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.brand h1 a { color: inherit; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 5px; text-decoration-color: var(--red); }
.brand h1 a:hover { color: var(--accent); }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(24px, 3vw, 34px); line-height: 1; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; margin-left: auto; }
.ctl { display: flex; flex-direction: column; gap: 4px; }
.ctl label, .ctl .lab { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 11px; cursor: pointer; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
select, input[type="search"] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13.5px; }
input[type="search"] { width: 200px; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 14px; }
.stage { position: relative; min-height: 0; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage svg { display: block; width: 100%; height: 100%; cursor: zoom-out; }
.crumbs { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 13.5px; pointer-events: none; }
.crumbs button { pointer-events: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; cursor: pointer; color: var(--ink-2); }
.crumbs button.cur { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.crumbs .sep { color: var(--ink-3); }
.layer { position: absolute; top: 46px; left: 14px; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); letter-spacing: .04em; pointer-events: none; }
.legend { position: absolute; left: 14px; bottom: 12px; max-width: calc(100% - 28px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--ink-2); pointer-events: none; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.hint { position: absolute; right: 14px; top: 46px; font-size: 12px; color: var(--ink-3); text-align: right; pointer-events: none; max-width: 240px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 7px 10px; border-radius: 8px; font-size: 13px; max-width: 260px; line-height: 1.35; opacity: 0; transition: opacity .12s; }
.tip b { display: block; font-weight: 600; }

.g-circle { cursor: pointer; transition: stroke .15s; }
.g-circle:hover { stroke: var(--ink); }
.leaf { cursor: pointer; }
.leaf circle { stroke: var(--surface); stroke-width: 1.5; }
.leaf.sel circle { stroke: var(--ink); stroke-width: 3; }
.leaf.dim { opacity: .14; }
.away { opacity: .28; }
.hint.gone { display: none; }
.leaf text { pointer-events: none; fill: var(--on-dot); font-family: var(--f-body); font-weight: 600; text-anchor: middle; dominant-baseline: central; }
.glabel { pointer-events: none; text-anchor: middle; font-family: var(--f-display); font-weight: 700; letter-spacing: -.01em; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; }
.glabel .n { font-family: var(--f-mono); font-weight: 400; fill: var(--ink-2); }

aside.panel { min-height: 0; min-width: 0; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 22px; display: flex; flex-direction: column; gap: 18px; }
.p-head .k { font-family: var(--f-mono); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.p-head h2 { font-family: var(--f-display); font-size: 26px; line-height: 1.1; margin: 4px 0 6px; text-wrap: balance; }
.p-head p { margin: 0; color: var(--ink-2); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { border-top: 2px solid var(--accent); padding-top: 6px; }
.stat b { font-family: var(--f-display); font-size: 24px; display: block; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--ink-2); }
.stat.ai { border-color: var(--ai); }
.bars { display: flex; flex-direction: column; gap: 5px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 90px 26px; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; background: none; border: 0; padding: 2px 0; text-align: left; }
.bar:hover .bn { text-decoration: underline; }
.bar .bt { height: 8px; background: var(--ring-2); border-radius: 4px; overflow: hidden; }
.bar .bt i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar .bc { font-family: var(--f-mono); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.group h3 { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; margin: 0 0 6px; padding-bottom: 5px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.co { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 4px; border-radius: 8px; }
.co:hover { background: var(--bg); }
.co.sel { background: var(--bg); box-shadow: inset 3px 0 0 var(--accent); }
.mono { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--on-dot); font-weight: 600; font-size: 12.5px; letter-spacing: .02em; text-decoration: none; position: relative; }
a.mono:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
.co .txt { min-width: 0; cursor: pointer; background: none; border: 0; text-align: left; padding: 0; }
.co .nm { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.co .ds { font-size: 13px; color: var(--ink-2); }
.go { font-size: 12.5px; text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; white-space: nowrap; color: var(--ink-2); }
.go:hover { border-color: var(--ink); color: var(--ink); }
.badge { font-family: var(--f-mono); font-size: 10.5px; padding: 1px 5px; border-radius: 4px; background: var(--ai-soft); color: var(--ai-ink); font-weight: 500; }
.badge.add { background: transparent; border: 1px solid var(--ai); }
.detail { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--bg); }
.detail .dtop { display: flex; gap: 12px; align-items: center; }
.detail .mono { width: 48px; height: 48px; font-size: 16px; border-radius: 12px; }
.detail h2 { font-family: var(--f-display); font-size: 24px; margin: 0; line-height: 1.1; }
.detail .sub { font-size: 13px; color: var(--ink-2); }
.detail .close { margin-left: auto; align-self: start; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; padding: 2px 8px; }
.visit { display: inline-flex; align-self: start; align-items: center; gap: 6px; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; }
.visit:hover { background: var(--ink); color: var(--surface); }
dl.facts { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 10px; margin: 0; font-size: 13.5px; }
dl.facts dt { color: var(--ink-3); font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
dl.facts dd { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; background: var(--surface); }
.note { font-size: 12.5px; color: var(--ink-3); }
.empty { color: var(--ink-3); font-size: 13.5px; }

@media (max-width: 900px) {
  html, body { height: auto; }
  main { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 78vw; min-height: 340px; max-height: 620px; }
  aside.panel { overflow: visible; }
  .controls { margin-left: 0; }
  input[type="search"] { width: 100%; }
  .hint { display: none; }
  .layer { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const LENSES = {

  product: { name: "What they sell", keys: [d => [d.product], d => d.market], l1: "product types", l2: "markets", sentence: "Grouped by what they sell, then by customer market." },

};

const PALETTES = {

  label: ["IA", "Santé", "Spatial", "Electronique", "Energie & décarbonation", "Cybersécurité", "Robotique", "Quantique"],

};
const LABEL_FR = { "Electronique": "Électronique", "Energie & décarbonation": "Énergie & décarbonation" };
const frLabel = s => LABEL_FR[s] || s;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

let state = { lens: "market", colorBy: "product", q: "", selected: null };
let root, focus, view, nodesSel, leavesSel, labelsSel, svg, gAll, diameter = 600, W = 600, H = 600;

function colorOf(d) {
  if (state.colorBy === "ai") return d.aiScope === "Core / enabling AI" ? cssVar("--ai") : d.aiScope === "Additional AI offer" ? cssVar("--c4") : cssVar("--none");
  const list = PALETTES[state.colorBy];
  const v = state.colorBy === "product" ? d.product : state.colorBy === "label" ? d.label : d.market;
  const i = list.indexOf(v);
  return cssVar("--c" + (i + 1)) || cssVar("--none");
}
function initials(name) {
  const w = name.replace(/[^A-Za-zÀ-ÿ0-9 \-]/g, "").split(/[\s\-]+/).filter(Boolean);
  if (w.length >= 2 && !/^(AI|Systems|Group|Technology|Software|Security|Data|Diamond|Electronics|Medical|Services)$/i.test(w[1])) return (w[0][0] + w[1][0]).toUpperCase();
  return w[0].slice(0, 2).toUpperCase().replace(/^(.)(.)$/, (m, a, b) => a + b.toLowerCase());
}
function aiBadge(d) {
  if (d.aiScope === "Core / enabling AI") return '<span class="badge" title="AI is core or enabling in the offer">AI</span>';
  if (d.aiScope === "Additional AI offer") return '<span class="badge add" title="AI is an add-on to another product">+AI</span>';
  return "";
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function buildTree() {
  const L = LENSES[state.lens];
  const top = new Map();
  DATA.forEach(d => {
    L.keys[0](d).forEach(k1 => {
      const k2 = L.keys[1](d);
      if (!top.has(k1)) top.set(k1, new Map());
      const m = top.get(k1);
      if (!m.has(k2)) m.set(k2, []);
      m.get(k2).push(d);
    });
  });
  const tree = { name: "All 80 companies", children: [...top].map(([k1, m]) => ({
    name: k1, children: [...m].map(([k2, arr]) => ({ name: k2, children: arr.map(d => ({ name: d.name, co: d })) }))
  })) };
  return d3.hierarchy(tree).sum(d => d.co ? 1 : 0).sort((a, b) => (b.value - a.value) || a.data.name.localeCompare(b.data.name));
}

function render(keepFocusPath) {
  const stage = document.getElementById("stage");
  W = stage.clientWidth; H = stage.clientHeight;
  diameter = Math.min(W, H - 70);
  root = d3.pack().size([diameter, diameter]).padding(d => d.depth === 0 ? 10 : d.depth === 1 ? 6 : 2)(buildTree());
  focus = root;
  if (keepFocusPath && keepFocusPath.length) {
    let n = root;
    for (const name of keepFocusPath) { const c = (n.children || []).find(x => x.data.name === name); if (!c) break; n = c; }
    if (n.children) focus = n;
  }
  svg = d3.select("#svg").attr("viewBox", [-W / 2, -H / 2 - 8, W, H]);
  svg.selectAll("*").remove();
  svg.on("click", () => zoomOut());
  gAll = svg.append("g");

  const groups = root.descendants().filter(d => d.children);
  nodesSel = gAll.append("g").selectAll("circle").data(groups).join("circle")
    .attr("class", d => d.depth ? "g-circle" : "")
    .attr("fill", d => d.depth === 0 ? "transparent" : d.depth === 1 ? cssVar("--ring-1") : cssVar("--ring-2"))
    .attr("stroke", d => d.depth === 0 ? "none" : cssVar("--ring-stroke"))
    .attr("stroke-width", 1)
    .on("click", (e, d) => { e.stopPropagation(); if (focus !== d) zoom(d); });

  leavesSel = gAll.append("g").selectAll("g").data(root.leaves()).join("g")
    .attr("class", "leaf")
    .on("click", (e, d) => { e.stopPropagation(); select(d.data.co, d); })
    .on("mousemove", (e, d) => showTip(e, d.data.co))
    .on("mouseleave", hideTip);
  leavesSel.append("circle").attr("fill", d => colorOf(d.data.co));
  leavesSel.append("text");

  labelsSel = gAll.append("g").selectAll("text").data(groups.filter(d => d.depth > 0)).join("text").attr("class", "glabel");
  labelsSel.append("tspan").attr("class", "t");
  labelsSel.append("tspan").attr("class", "n");

  view = [focus.x, focus.y, focus.r * 2 + 8];
  zoomTo(view);
  applySearch();
  fadeOthers();
  updateLegend();
  updateChrome();
}

function zoomTo(v) {
  const k = diameter / v[2];
  view = v;
  nodesSel.attr("cx", d => (d.x - v[0]) * k).attr("cy", d => (d.y - v[1]) * k).attr("r", d => d.r * k);
  leavesSel.attr("transform", d => `translate(${(d.x - v[0]) * k},${(d.y - v[1]) * k})`);
  leavesSel.select("circle").attr("r", d => d.r * k);
  leavesSel.select("text").each(function (d) {
    const r = d.r * k, t = d3.select(this);
    t.selectAll("tspan").remove();
    if (r < 9) { t.text(""); return; }
    if (r < 30) { t.text(initials(d.data.name)).attr("font-size", Math.max(8, Math.min(13, r * 0.7))); return; }
    const fs = Math.max(9, Math.min(15, r * 0.26));
    t.text("").attr("font-size", fs);
    const words = d.data.name.split(" ");
    let lines = [d.data.name];
    if (d.data.name.length * fs * 0.55 > r * 1.7 && words.length > 1) {
      let best = 1, bestDiff = 1e9;
      for (let i = 1; i < words.length; i++) { const a = words.slice(0, i).join(" ").length, b = words.slice(i).join(" ").length; if (Math.abs(a - b) < bestDiff) { bestDiff = Math.abs(a - b); best = i; } }
      lines = [words.slice(0, best).join(" "), words.slice(best).join(" ")];
    }
    lines.forEach((ln, i) => t.append("tspan").attr("x", 0).attr("dy", i === 0 ? -(lines.length - 1) * fs * 0.55 : fs * 1.1).text(ln));
  });
  labelsSel.each(function (d) {
    const r = d.r * k, t = d3.select(this);
    const show = d.parent === focus && r > 26;
    t.attr("display", show ? null : "none");
    if (!show) return;
    const fs = Math.max(11, Math.min(d.depth === focus.depth + 1 ? 17 : 14, r * 0.16));
    const x = (d.x - v[0]) * k, y = (d.y - v[1]) * k - r + fs * 1.25;
    t.attr("x", x).attr("y", y).attr("font-size", fs);
    const nm = state.lens === "label" && d.depth === 1 ? frLabel(d.data.name) : short(d.data.name);
    t.select(".t").text(nm);
    t.select(".n").text(" " + d.value);
  });
}

function zoom(d) {
  focus = d;
  const tr = svg.transition().duration(matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 700)
    .tween("zoom", () => { const i = d3.interpolateZoom(view, [focus.x, focus.y, focus.r * 2 + 8]); return t => zoomTo(i(t)); });
  fadeOthers();
  updateChrome();
}
function fadeOthers() {
  const inFocus = d => d === focus || d.ancestors().includes(focus);
  nodesSel.classed("away", d => d.depth > 0 && !inFocus(d) && !focus.ancestors().includes(d));
  leavesSel.classed("away", d => !inFocus(d));
  document.querySelector(".hint").classList.toggle("gone", focus.depth > 0);
}
function zoomOut() { if (focus.parent) zoom(focus.parent); }
function pathOf(n) { return n.ancestors().reverse().slice(1).map(x => x.data.name); }

function select(co, leafNode) {
  state.selected = co;
  leavesSel.classed("sel", d => d.data.co === co);
  if (leafNode.parent !== focus) zoom(leafNode.parent); else updateChrome();
  document.getElementById("panel").scrollTop = 0;
}

function showTip(e, co) {
  const tip = document.getElementById("tip"), st = document.getElementById("stage").getBoundingClientRect();
  tip.innerHTML = `<b>${esc(co.name)}</b>${esc(co.short)}`;
  let x = e.clientX - st.left + 14, y = e.clientY - st.top + 14;
  if (x > st.width - 270) x -= 290;
  tip.style.left = x + "px"; tip.style.top = y + "px"; tip.style.opacity = 1;
}
function hideTip() { document.getElementById("tip").style.opacity = 0; }

function matches(co) {
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return [co.name, co.short, co.desc, co.tags, co.tech.join(" "), co.market, co.product, co.label].join(" ").toLowerCase().includes(q);
}
function applySearch() { leavesSel.classed("dim", d => !matches(d.data.co)); }

function updateLegend() {
  const el = document.getElementById("legend");
  if (state.colorBy === "ai") {
    el.innerHTML = `<span><i style="background:var(--ai)"></i>AI core or enabling</span><span><i style="background:var(--c4)"></i>AI add-on</span><span><i style="background:var(--none)"></i>No AI role established</span>`;
    return;
  }
  el.innerHTML = PALETTES[state.colorBy].map((v, i) => `<span><i style="background:var(--c${i + 1})"></i>${esc(state.colorBy === "label" ? frLabel(v) : short(v))}</span>`).join("");
}

function updateChrome() {
  const L = LENSES[state.lens];
  const crumbs = document.getElementById("crumbs");
  const chain = focus.ancestors().reverse();
  crumbs.innerHTML = "";
  chain.forEach((n, i) => {
    if (i) { const s = document.createElement("span"); s.className = "sep"; s.textContent = "›"; crumbs.appendChild(s); }
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = n.depth === 0 ? "All 80" : (state.lens === "label" && n.depth === 1 ? frLabel(n.data.name) : short(n.data.name));
    if (n === focus) b.className = "cur";
    b.onclick = e => { e.stopPropagation(); if (n !== focus) zoom(n); };
    crumbs.appendChild(b);
  });
  const layerNames = [`Layer 1 of 3 · ${L.l1}`, `Layer 2 of 3 · ${L.l2}`, "Layer 3 of 3 · companies"];
  document.getElementById("layer").textContent = layerNames[focus.depth] || "";
  renderPanel();
}

function companyRow(co) {
  const sel = state.selected === co ? " sel" : "";
  const icon = co.website
    ? `<a class="mono" href="${esc(co.website)}" target="_blank" rel="noopener" style="background:${colorOf(co)}" title="Open ${esc(co.name)} website" aria-label="Open ${esc(co.name)} website">${esc(initials(co.name))}</a>`
    : `<span class="mono" style="background:${colorOf(co)}" title="No website listed">${esc(initials(co.name))}</span>`;
  const go = co.website ? `<a class="go" href="${esc(co.website)}" target="_blank" rel="noopener" aria-label="Visit ${esc(co.name)}">Visit ↗</a>` : `<span class="go" title="No website listed">—</span>`;
  return `<div class="co${sel}" data-name="${esc(co.name)}">${icon}<button type="button" class="txt" data-pick="${esc(co.name)}"><span class="nm">${esc(co.name)} ${aiBadge(co)}</span><span class="ds">${esc(co.short)}</span></button>${go}</div>`;
}

function renderDetail(co) {
  const secondary = co.secondary.length ? co.secondary.map(short).join(", ") : "None listed";
  const tech = co.tags ? co.tags.split("|").map(s => `<span class="chip">${esc(s.trim())}</span>`).join("") : '<span class="note">Not disclosed</span>';
  const aiText = co.aiScope === "Not established" ? "No AI role established from the sources reviewed." : `${esc(co.aiRoles.replace(/\|/g, "·"))}. ${esc(co.aiWhy)}`;
  const visit = co.website
    ? `<a class="visit" href="${esc(co.website)}" target="_blank" rel="noopener">Visit ${esc(co.website.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""))} ↗</a>`
    : (co.source ? `<a class="visit" href="${esc(co.source)}" target="_blank" rel="noopener">No company site · open the source ↗</a>` : `<span class="note">No website listed</span>`);
  return `<div class="detail">
    <div class="dtop">${co.website ? `<a class="mono" href="${esc(co.website)}" target="_blank" rel="noopener" style="background:${colorOf(co)}" aria-label="Open ${esc(co.name)} website">${esc(initials(co.name))}</a>` : `<span class="mono" style="background:${colorOf(co)}">${esc(initials(co.name))}</span>`}
      <div><h2>${esc(co.name)}</h2><div class="sub">${esc(co.short)}</div></div>
      <button type="button" class="close" id="close" aria-label="Close company details">✕</button></div>
    ${visit}
    <p style="margin:0">${esc(co.desc)}</p>
    <dl class="facts">
      <dt>Sells</dt><dd>${esc(co.product)}</dd>
      <dt>Market</dt><dd>${esc(co.market)}</dd>
      <dt>Also serves</dt><dd>${esc(secondary)}</dd>
      <dt>Customers</dt><dd>${esc(co.customers)}</dd>
      <dt>Label</dt><dd>${esc(frLabel(co.label))}</dd>
      <dt>Tech</dt><dd><div class="chips">${tech}</div></dd>
      <dt>AI</dt><dd>${aiBadge(co)} ${aiText}</dd>
      <dt>Evidence</dt><dd>${esc(co.evidence)}</dd>
    </dl>
    <div class="note">${esc(co.devNote)}</div>
  </div>`;
}

function renderPanel() {
  const L = LENSES[state.lens];
  const panel = document.getElementById("panel");
  const leaves = focus.leaves().map(l => l.data.co);
  const uniq = [...new Map(leaves.map(c => [c.name, c])).values()];
  const aiN = uniq.filter(c => c.aiScope !== "Not established").length;
  const title = focus.depth === 0 ? "All 80 companies" : (state.lens === "label" && focus.depth === 1 ? frLabel(focus.data.name) : focus.data.name);
  const kicker = focus.depth === 0 ? `Explore by ${L.name.toLowerCase()}` : focus.depth === 1 ? L.name : `${state.lens === "label" ? frLabel(focus.parent.data.name) : short(focus.parent.data.name)} ›`;
  const lead = focus.depth === 0 ? L.sentence : (DESC[focus.data.name] || "");
  let html = "";
  if (state.selected) html += renderDetail(state.selected);
  html += `<div class="p-head"><div class="k">${esc(kicker)}</div><h2>${esc(title)}</h2><p>${esc(lead)}</p></div>`;
  html += `<div class="stats"><div class="stat"><b>${uniq.length}</b><span>companies</span></div>${focus.depth < 2 ? `<div class="stat"><b>${focus.children.length}</b><span>${focus.depth === 0 ? L.l1 : L.l2}</span></div>` : `<div class="stat"><b>${Math.round(uniq.length / 80 * 100)}%</b><span>of the cohort</span></div>`}<div class="stat ai"><b>${aiN}</b><span>with AI in the offer</span></div></div>`;
  if (focus.depth < 2) {
    const max = d3.max(focus.children, c => c.value);
    html += `<div class="bars">${focus.children.map((c, i) => `<button type="button" class="bar" data-zoom="${i}"><span class="bn">${esc(state.lens === "label" && c.depth === 1 ? frLabel(c.data.name) : short(c.data.name))}</span><span class="bt"><i style="width:${(c.value / max) * 100}%"></i></span><span class="bc">${c.value}</span></button>`).join("")}</div>`;
  }
  const groupsForList = focus.depth === 2 ? [focus] : focus.depth === 1 ? focus.children : focus.children;
  html += groupsForList.map(g => {
    const cos = g.leaves().map(l => l.data.co).filter(matches).sort((a, b) => a.name.localeCompare(b.name));
    const uniqCos = [...new Map(cos.map(c => [c.name, c])).values()];
    if (!uniqCos.length) return "";
    const head = focus.depth === 2 ? "Companies" : (state.lens === "label" && g.depth === 1 ? frLabel(g.data.name) : short(g.data.name));
    return `<div class="group"><h3><span>${esc(head)}</span><span>${uniqCos.length}</span></h3>${uniqCos.map(companyRow).join("")}</div>`;
  }).join("") || `<p class="empty">No company here matches “${esc(state.q)}”.</p>`;
  html += `<p class="note">Icons and “Visit” open each company’s website in a new tab. Placement describes the offer, not maturity. Source: La Mission French Tech roster and company pages, reviewed 16 October 2026. Independent analysis, not affiliated with La Mission French Tech.</p>`;
  panel.innerHTML = html;
  panel.querySelectorAll("[data-zoom]").forEach(b => b.onclick = () => zoom(focus.children[+b.dataset.zoom]));
  panel.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    const name = b.dataset.pick;
    const leaf = focus.leaves().find(l => l.data.name === name) || root.leaves().find(l => l.data.name === name);
    state.selected = leaf.data.co;
    leavesSel.classed("sel", d => d.data.co === state.selected);
    if (leaf.parent !== focus) zoom(leaf.parent); else renderPanel();
    panel.scrollTop = 0;
  });
  const c = document.getElementById("close");
  if (c) c.onclick = () => { state.selected = null; leavesSel.classed("sel", false); renderPanel(); };
}

document.querySelectorAll("#lens button").forEach(b => b.onclick = () => {
  state.lens = b.dataset.lens;
  document.querySelectorAll("#lens button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  try { localStorage.setItem("ft-lens", state.lens); } catch (e) {}
  render();
  if (state.selected) leavesSel.classed("sel", d => d.data.co === state.selected);
});
document.getElementById("colorby").onchange = e => {
  state.colorBy = e.target.value;
  leavesSel.select("circle").attr("fill", d => colorOf(d.data.co));
  updateLegend(); renderPanel();
};
document.getElementById("q").oninput = e => { state.q = e.target.value.trim(); applySearch(); renderPanel(); };
document.getElementById("q").onkeydown = e => {
  if (e.key !== "Enter") return;
  const hits = root.leaves().filter(l => matches(l.data.co));
  if (hits.length) { state.selected = hits[0].data.co; leavesSel.classed("sel", d => d.data.co === state.selected); zoom(hits[0].parent); }
};
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.activeElement.id !== "q") zoomOut(); });
let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(() => { const p = pathOf(focus); render(p); if (state.selected) leavesSel.classed("sel", d => d.data.co === state.selected); }, 120); }).observe(document.getElementById("stage"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render(pathOf(focus)));
new MutationObserver(() => render(pathOf(focus))).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

try { const l = localStorage.getItem("ft-lens"); if (l && LENSES[l]) { state.lens = l; document.querySelectorAll("#lens button").forEach(x => x.setAttribute("aria-pressed", x.dataset.lens === l ? "true" : "false")); } } catch (e) {}
render();
</script>

</body></html>
